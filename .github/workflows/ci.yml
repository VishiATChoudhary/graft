name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - name: repository tests against a 3-shard storage fleet
        run: GRAFT_TEST_SHARDS=3 go test -race ./internal/repo/
      - run: go build -o bin/gft ./cmd/gft
      - name: smoke test against git
        run: bench/smoke.sh
